// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {

    repositories {
        google()
    }
    dependencies {

     // classpath 'com.google.gms:google-services:4.3.15'
       // classpath 'com.android.tools.build:gradle-core:3.1.4'
       // classpath "com.android.tools.build:gradle:8.13.0"
        def nav_version = "2.5.3"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"



    }
}



plugins {
    //8.0.1
    //
    // id 'com.android.application' version '8.0.1' apply false
    // id 'com.android.library' version '8.0.1' apply false

    // 👈 استخدام إصدار مستقر وموجود بالفعل من AGP
    id 'com.android.application' version '8.2.2' apply false
    id 'com.android.library' version '8.2.2' apply false

    // 👈 ترقية Kotlin إلى إصدار يدعم JVM 17/21
    id 'org.jetbrains.kotlin.android' version '1.9.23' apply false

    id 'com.google.gms.google-services' version '4.3.15' apply false
}


// Define versions in a single place
ext {


    // App dependencies
    androidXVersion = '1.0.0'
    androidXTestCoreVersion = '1.5.0'
    androidXTestExtKotlinRunnerVersion = '1.1.5'
    androidXTestRulesVersion = '1.5.0'
    androidXAnnotations = '1.7.1'
    appCompatVersion = '1.6.1'
    archLifecycleVersion = '2.7.0'
    coroutinesVersion = '1.7.3'
    cardVersion = '1.0.0'
    espressoVersion = '3.5.1'
    fragmentKtxVersion = '1.6.2'
    junitVersion = '4.13.2'
    materialVersion = '1.11.0'
    recyclerViewVersion = '1.3.2'
    roomVersion = '2.6.1'
    rulesVersion = '1.0.1'
    swipeRefreshLayoutVersion = '1.1.0'
    timberVersion = '5.0.1'
}